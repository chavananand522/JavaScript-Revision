<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js Event Types</title>
</head>

<body onload="console.log('Page Loaded')">
    <h1>Js Event Types</h1>

    <!-- 1. Click Event -->
    <button onclick="alert('button Clicked!')">Click Me</button>

    <hr>

    <!-- 2.Submit Event -->

    <form onsubmit="alert('Form Submitted!');return false;"> <!-- return false.=> Don't actually submit the form / don't
        reload the page." -->
        <input type="text" required placeholder="Enter Name">
        <button type="submit">Submit</button>

        <hr>

        <!-- 3. Keypress Event(using keydown) -->
        <input type="text" onkeydown="console.log('key pressed')" placeholder="Press a key">

        <hr>

        <!-- 4.MouseOver Event -->
        <p onmouseover="this.style.color='blue'">
            move mouse on me
        </p>

        <hr>

        <!-- 5.Mouseout Event -->
        <p onmouseout="this.style.background='yellow'">
            My name is Anand Chavan
        </p>

        <hr>

        <!-- 6.Focus Event -->
        <input type="text" onfocus="this.style.background='orange'" placeholder="Focus Event ">

        <hr>

        <!-- 7.Blur Event -->
        <input type="text" onblur="this.style.background='lightgray'" placeholder="Event Blur">

        <hr>

        <!-- 8.Change Event -->
        <select onchange="alert('Course Changed!')">
            <option>Java</option>
            <option>Python</option>
            <option>Js</option>
        </select>

        <hr>
    </form>
</body>

</html>
